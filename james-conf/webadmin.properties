#  This template file can be used as example for James Server configuration
#  DO NOT USE IT AS SUCH AND ADAPT IT TO YOUR NEEDS

# Read https://james.apache.org/server/config-webadmin.html for further details

# LOCAL CHANGE from James's stock webadmin.properties.
#
# Disabled outright. Nothing in this repo uses the webadmin REST API: domain and
# account provisioning goes through `james-cli` over JMX (see SETUP.md), and
# Nextcloud only ever speaks SMTP on 587. Left enabled, stock James binds webadmin
# on 0.0.0.0:8000 with `jwt.enabled` commented out below -- i.e. no auth at all in
# front of an API that can create/delete accounts and read mail queues.
#
# This also retires conf/jwt_publickey, which shipped as James's public DEMO
# keypair; the matching private key is published in the James source tree, so it
# authenticates nobody. Anirban asked to replace it with the public key from the
# Nextcloud self-signed TLS cert. That would swap one unused key for another and
# would mean committing a per-machine key (the cert is generated by SETUP.md and
# is gitignored), so turning the surface off is the real fix instead. If webadmin
# is ever needed, set jwt.enabled=true with a DEDICATED RSA keypair -- never the
# TLS cert's, since reusing a TLS key for token signing is its own problem.
enabled=false
port=8000
host=0.0.0.0

# Defaults to false
https.enabled=false

# Compulsory when enabling HTTPS
#https.keystore=/path/to/keystore
#https.password=password

# Optional when enabling HTTPS (self signed)
#https.trust.keystore
#https.trust.password

# Defaults to false
#jwt.enabled=true
#
## If you wish to use OAuth authentication, you should provide a valid JWT public key.
## The following entry specify the link to the URL of the public key file,
## which should be a PEM format file.
##
#jwt.publickeypem.url=file://conf/jwt_publickey

# Defaults to false
#cors.enable=true
#cors.origin

# List of fully qualified class names that should be exposed over webadmin
# in addition to your product default routes. Routes needs to be located
# within the classpath or in the ./extensions-jars folder.
#extensions.routes=