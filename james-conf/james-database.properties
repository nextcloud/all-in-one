#  This template file can be used as example for James Server configuration
#  DO NOT USE IT AS SUCH AND ADAPT IT TO YOUR NEEDS

# Read https://james.apache.org/server/config-system.html#james-database.properties for further details

# LOCAL CHANGE from James's stock template, which defaults to embedded Derby.
#
# Points at the same PostgreSQL server Nextcloud uses (nextcloud-aio-database), in
# its own database, created by the nextcloud-aio-james-db-init one-shot service in
# docker-compose.yml. The PostgreSQL JDBC driver is not in the stock image; it is
# added to /root/libs by james-image/Dockerfile -- see the comments there for why
# extensions-jars does not work for this.
#
# ${env:VAR} resolves against the container environment: James reads these files
# through commons-configuration2, so no secret has to be committed here. Verified by
# setting a deliberately wrong value and watching James refuse to start.
database.driverClassName=org.postgresql.Driver
database.url=jdbc:postgresql://${env:JAMES_DB_HOST}:${env:JAMES_DB_PORT}/${env:JAMES_DB_NAME}
database.username=${env:JAMES_DB_USER}
database.password=${env:JAMES_DB_PASSWORD}

# Supported adapters are:
# DB2, DERBY, H2, HSQL, INFORMIX, MYSQL, ORACLE, POSTGRESQL, SQL_SERVER, SYBASE 
vendorAdapter.database=POSTGRESQL

# Use streaming for Blobs
# This is only supported on a limited set of databases atm. You should check if its supported by your DB before enable
# it. 
# 
# See:
# http://openjpa.apache.org/builds/latest/docs/manual/ref_guide_mapping_jpa.html  #7.11.  LOB Streaming 
# 
openjpa.streaming=false

# Validate the data source before using it
# datasource.testOnBorrow=true
# datasource.validationQueryTimeoutSec=2
# This is different per database. See https://stackoverflow.com/questions/10684244/dbcp-validationquery-for-different-databases#10684260
# datasource.validationQuery=select 1
# The maximum number of active connections that can be allocated from this pool at the same time, or negative for no limit.
# datasource.maxTotal=8
