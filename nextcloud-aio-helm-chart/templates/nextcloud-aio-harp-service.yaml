{{- if eq .Values.HARP_ENABLED "yes" }}
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-aio-harp
  name: nextcloud-aio-harp
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
    - name: "8780"
      port: 8780
      targetPort: 8780
  selector:
    io.kompose.service: nextcloud-aio-harp
{{- end }}
