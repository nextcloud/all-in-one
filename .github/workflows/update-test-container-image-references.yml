name: update-test-container-image-references

on:
  workflow_dispatch:
  schedule:
  - cron: '00 5 * * *'

jobs:
  update:
    name: Update test container image references
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install skopeo
      run: sudo apt-get install -y skopeo
    - name: Update Playwright version
      # The npm package and the container image must use the same Playwright version.
      # Only the tag is changed here, the digest is updated by the update script below.
      run: |
        playwright_version="$(npm view @playwright/test version)"
        cd php/tests
        npm install --save-dev --package-lock-only --no-audit --no-fund "@playwright/test@^$playwright_version"
        sed -i -E "s|(mcr\.microsoft\.com/playwright:)v[0-9.]+@|\1v$playwright_version@|" compose.yaml
    - name: Run update script
      run: python3 .ci/update-test-container-image-reference.py
      env:
        COMPOSE_FILES: php/tests/compose.yaml
        DOCKERFILE_FILES: php/tests/Containers/composer/Dockerfile
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(tests): update test container image references"
        signoff: true
        title: Update test container image references
        body: Automated update of the Playwright version and the node and playwright image digests in php/tests
        labels: dependencies, 3. to review
        milestone: next
        branch: update-test-container-image-references
