name: Lint Helm Charts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nextcloud-aio-helm-chart/**'
      - 'manual-install/**'
      - 'php/containers.json'
      - 'tests/talk-bitrate-generators.sh'
      - '.github/workflows/lint-helm.yml'

jobs:
  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.11.1

      - name: Lint charts
        run: helm lint nextcloud-aio-helm-chart

      - name: Generate and test Talk bitrate configuration
        run: |
          sudo bash manual-install/update-yaml.sh
          sudo bash nextcloud-aio-helm-chart/update-helm.sh test
          bash tests/talk-bitrate-generators.sh
          helm lint nextcloud-aio-helm-chart
