name: Playwright Tests on push

on:
  pull_request:
    paths:
      - 'php/**'
      - 'Containers/mastercontainer/*.Caddyfile'
      - 'Containers/mastercontainer/start.sh'
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - 'Containers/mastercontainer/*.Caddyfile'
      - 'Containers/mastercontainer/start.sh'

concurrency:
  group: playwright-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  BASE_URL: https://localhost:8080

jobs:
  test:
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Only one AIO instance can run per Docker host, so the specs of a group run one after another.
        # The restore test restores the backup that the initial setup test creates.
        group:
          - setup-and-restore
          - defaults-and-desec

    name: test (${{ matrix.group }})

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Playwright tests for initial setup
        if: matrix.group == 'setup-and-restore'
        env:
          SKIP_DOMAIN_VALIDATION: 'true'
        run: ./php/tests/run.sh ./php/tests/tests/initial-setup.spec.js

      - name: Run Playwright tests for backup restore
        if: matrix.group == 'setup-and-restore'
        run: ./php/tests/run.sh ./php/tests/tests/restore-instance.spec.js

      - name: Run Playwright tests for persisted defaults
        if: matrix.group == 'defaults-and-desec'
        run: ./php/tests/run.sh ./php/tests/tests/persist-default-config.spec.js

      - name: Run Playwright tests for desec registration
        if: matrix.group == 'defaults-and-desec'
        run: ./php/tests/run.sh ./php/tests/tests/desec-register.spec.js

      - name: Run Playwright tests for desec start over
        if: matrix.group == 'defaults-and-desec'
        run: ./php/tests/run.sh ./php/tests/tests/desec-start-over.spec.js

      - name: Run Playwright tests for desec with existing account
        if: matrix.group == 'defaults-and-desec'
        run: ./php/tests/run.sh ./php/tests/tests/desec-existing.spec.js

      - name: Run Playwright tests for desec with existing slug
        if: matrix.group == 'defaults-and-desec'
        run: ./php/tests/run.sh ./php/tests/tests/desec-existing-slug.spec.js

      - name: Run Playwright tests for desec with another slug than the existing one
        if: matrix.group == 'defaults-and-desec'
        run: ./php/tests/run.sh ./php/tests/tests/desec-existing-other-slug.spec.js

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.group }}
          path: php/tests/playwright-report/
          retention-days: 14
          overwrite: true
