name: Playwright Tests on push

on:
  pull_request:
    paths:
      - 'php/**'
      - 'Containers/mastercontainer/*.Caddyfile'
      - 'Containers/mastercontainer/start.sh'
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - 'Containers/mastercontainer/*.Caddyfile'
      - 'Containers/mastercontainer/start.sh'

concurrency:
  group: playwright-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  BASE_URL: https://localhost:8080

jobs:
  test:
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: persist-default-config
          # The restore test restores the backup that the initial setup test creates, so both share a runner.
          - spec: initial-setup
            skip_domain_validation: 'true'
            then: restore-instance
          - spec: desec-register
          - spec: desec-start-over
          - spec: desec-existing
          - spec: desec-existing-slug
          - spec: desec-existing-other-slug

    name: test (${{ matrix.spec }})

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Playwright tests for ${{ matrix.spec }}
        env:
          SKIP_DOMAIN_VALIDATION: ${{ matrix.skip_domain_validation || 'false' }}
        run: ./php/tests/run.sh ./php/tests/tests/${{ matrix.spec }}.spec.js

      - name: Run Playwright tests for ${{ matrix.then }}
        if: ${{ matrix.then }}
        env:
          SKIP_DOMAIN_VALIDATION: 'false'
        run: ./php/tests/run.sh ./php/tests/tests/${{ matrix.then }}.spec.js

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.spec }}
          path: php/tests/playwright-report/
          retention-days: 14
          overwrite: true
