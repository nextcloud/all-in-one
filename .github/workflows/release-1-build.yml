name: Release 1 - bump version and build images

on:
  workflow_dispatch:
    inputs:
      version:
        description: New AIO version (X.Y.Z)
        required: true

permissions:
  contents: read

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }} # zizmor: ignore[secrets-outside-env]
      - env:
          # Needs write access to this repo (including pushing to main) and permission to run
          # workflows in nextcloud-releases/all-in-one, which the default token doesn't have.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }} # zizmor: ignore[secrets-outside-env]
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: ./.github/scripts/release-build.sh "$VERSION"
