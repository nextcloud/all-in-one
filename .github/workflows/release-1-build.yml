name: Release 1 - bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: New AIO version (X.Y.Z)
        required: true

permissions:
  contents: read

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump the AIO version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like X.Y.Z, not $VERSION"
            exit 1
          fi
          echo "$VERSION" > php/templates/includes/aio-version.twig
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          commit-message: "chore(release): bump AIO version to ${{ inputs.version }}"
          signoff: true
          title: "chore(release): bump AIO version to ${{ inputs.version }}"
          body: Merge this, then build the images with https://github.com/nextcloud-releases/all-in-one/actions/workflows/build_images.yml
          branch: aio-version-bump
          token: ${{ secrets.GITHUB_TOKEN }}
