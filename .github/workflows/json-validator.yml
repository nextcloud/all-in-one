name: Json Validator

on:
  pull_request:
    paths:
      - '**.json'
  push:
    branches:
      - main
    paths:
      - '**.json'

jobs:
  json-validator:
    name: Json Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Validate Json
        run: |
          sudo apt-get update
          sudo apt-get install python3-venv -y --no-install-recommends
          python3 -m venv venv
          . venv/bin/activate
          pip3 install json-spec
          if ! json validate --schema-file=php/containers-schema.json --document-file=php/containers.json; then
            exit 1
          fi
          # All default containers must drop all capabilities and only add back the ones they need via cap_add
          MISSING_CAP_DROP_ALL="$(jq -r '.aio_services_v1[] | select(.cap_drop != ["ALL"]) | .container_name' php/containers.json)"
          if [ -n "$MISSING_CAP_DROP_ALL" ]; then
            echo "The following containers in php/containers.json do not set cap_drop to [\"ALL\"]:"
            echo "$MISSING_CAP_DROP_ALL"
            exit 1
          fi
          JSON_FILES="$(find ./community-containers -name '*.json')"
          mapfile -t JSON_FILES <<< "$JSON_FILES"
          for file in "${JSON_FILES[@]}"; do
            json validate --schema-file=php/containers-schema.json --document-file="$file" 2>&1 | tee -a ./json-validator.log
          done
          if grep -q "document does not validate with schema.\|invalid JSONFile" ./json-validator.log; then
            exit 1
          fi
