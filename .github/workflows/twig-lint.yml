name: Twig Lint

on:
  pull_request:
    paths:
      - '**.twig'
  push:
    branches:
      - main
    paths:
      - '**.twig'

permissions:
  contents: read

concurrency:
  group: lint-twig-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  twig-lint:
    runs-on: ubuntu-latest
    name: twig-lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.5
          extensions: apcu
          coverage: none

      - name: twig lint
        run: |
          cd php
          composer install
          composer run lint:twig
