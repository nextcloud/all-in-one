# This setup expects that you run the services via profiles!
# Usage: docker compose --profile local-code up
#    or: docker compose --profile code-from-image up

name: nextcloud-aio-test
services:
  composer:
    image: docker.io/library/composer:2@sha256:50ea4d33fdcde1adb0f045547295faa1548b33872e5f789dae5b02ce2fb5de93
    volumes:
      - ..:/app
    working_dir: /app
    command: |-
      bash -c '
        test -d ./data && rm -r ./data
        test -d ./session && rm -r ./session
        composer install --no-dev --ignore-platform-req=ext-apcu
        composer clear-cache
      '

  app-base:
    image: ghcr.io/nextcloud-releases/all-in-one:develop${ARM64_SUFFIX-}
    pull_policy: always # Always pull so we don't risk to run into the "Update for mastercontainer" page.
    init: true
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    profiles:
      - none
    environment:
      SKIP_DOMAIN_VALIDATION: ${SKIP_DOMAIN_VALIDATION-true}
      APACHE_PORT: 11000
      WATCHTOWER_DOCKER_SOCKET_PATH: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      TESTING___DESEC_API_BASE: http://desec-mock:8090/api/v1 
      TESTING___DESEC_UPDATE_URL: http://desec-mock:8090/update
    entrypoint: bash /start.sh
    # The image's healthcheck only runs every 30s and passes before the interface is up as long as no configuration exists.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 && test -S /run/php/php.sock"]
      interval: 2s

  app-code-from-image:
    extends: app-base
    container_name: nextcloud-aio-mastercontainer
    profiles:
      - code-from-image

  app-local-code:
    extends: app-base
    container_name: nextcloud-aio-mastercontainer
    depends_on:
      composer:
        condition: service_completed_successfully
    volumes:
      - ..:/var/www/docker-aio/php
      - ../../Containers/mastercontainer/internal.Caddyfile:/internal.Caddyfile
      - ../../Containers/mastercontainer/headers.Caddyfile:/headers.Caddyfile
      - ../../Containers/mastercontainer/start.sh:/start.sh
    profiles:
      - local-code

  desec-mock:
    image: docker.io/library/node:26@sha256:e18c3ccdf7d71619990b0e85639f506e2028a95410999cab24cc373cbd10e0ac
    volumes:
      - ..:/app/php
    working_dir: /app
    command: node php/tests/desec-mock.mjs 8090 2>&1
          
  npm-installer:
    image: docker.io/library/node:26@sha256:e18c3ccdf7d71619990b0e85639f506e2028a95410999cab24cc373cbd10e0ac
    volumes:
      - ..:/app
    working_dir: /app/tests
    command: npm ci --omit=optional

  test-runner-base:
    image: mcr.microsoft.com/playwright:v1.65.1@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    volumes:
      - ..:/app
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro # to read the private key from the Nextcloud container's env
    working_dir: /app/tests
    ports:
      - '9323:9323' # to view test reports
    profiles:
      - none
    depends_on:
      desec-mock:
        condition: service_started
      npm-installer:
        condition: service_completed_successfully
    environment:
      BASE_URL: "https://nextcloud-aio-mastercontainer:8080"
      DEBUG: "pw:api"
      CI: "true"
      DESEC_MOCK_URL: "http://desec-mock:8090"
    command: npx playwright test "${TESTS_FILE-}"

  test-runner-code-from-image:
    extends: test-runner-base
    container_name: test-runner
    profiles:
      - code-from-image
    depends_on:
      app-code-from-image:
        condition: service_healthy

  test-runner-local-code:
    extends: test-runner-base
    container_name: test-runner
    profiles:
      - local-code
    depends_on:
      app-local-code:
        condition: service_healthy

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
